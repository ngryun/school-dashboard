name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check and test
        run: |
          npm run check
          npm test

      # GitHub Pages serves the static frontend only, so the browser calls NEIS
      # directly. The shared key comes from the NEIS_API_KEY repository secret and
      # the 학교알리미 relay (Cloudflare Worker) URL from the API_BASE repository
      # variable; both are written into public/config.js at deploy time.
      - name: Inject runtime config
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
          API_BASE: ${{ vars.API_BASE }}
        run: |
          node -e "
            const key = (process.env.NEIS_API_KEY || '').trim();
            const apiBase = (process.env.API_BASE || '').trim().replace(/\/+$/, '');
            if (!/^[A-Za-z0-9]*$/.test(key)) throw new Error('NEIS_API_KEY has unexpected characters');
            if (apiBase && !/^https:\/\/[A-Za-z0-9.-]+(\/[A-Za-z0-9._~-]*)*$/.test(apiBase)) throw new Error('API_BASE must be an https URL');
            require('fs').writeFileSync('public/config.js', 'export const config=' + JSON.stringify({ key, apiBase }) + ';\n');
            console.log(key ? 'shared NEIS key injected' : 'no NEIS_API_KEY secret; visitors must enter their own key');
            console.log(apiBase ? '학교알리미 relay: ' + apiBase : 'no API_BASE variable; student/teacher counts disabled');
          "
          node --check public/config.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
