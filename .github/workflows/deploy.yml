name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check and test
        run: |
          npm run check
          npm test

      # GitHub Pages serves the static frontend only, so the browser calls NEIS
      # directly. The shared key comes from the NEIS_API_KEY repository secret and
      # is written into public/config.js at deploy time (never committed).
      - name: Inject shared NEIS key
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
        run: |
          node -e "
            const key = (process.env.NEIS_API_KEY || '').trim();
            if (!/^[A-Za-z0-9]*$/.test(key)) throw new Error('NEIS_API_KEY has unexpected characters');
            require('fs').writeFileSync('public/config.js', 'export const config={key:' + JSON.stringify(key) + '};\n');
            console.log(key ? 'shared key injected' : 'no NEIS_API_KEY secret; visitors must enter their own key');
          "
          node --check public/config.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
